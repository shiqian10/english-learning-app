<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英语乐园">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF6B9D">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%23FF6B9D'/><text x='96' y='140' font-size='120' text-anchor='middle'>🌈</text></svg>">
  <title>英语乐园 🌈</title>
  <script src="data.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --pink: #FF6B9D;
      --blue: #4ECDC4;
      --yellow: #FFE66D;
      --orange: #FF9F43;
      --purple: #A78BFA;
      --green: #34D399;
      --red: #F87171;
      --bg: #FFF5F5;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-height: 64px;
      --font: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    }
    
    html {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========== App Shell布局 ========== */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ========== 顶部栏 ========== */
    .top-bar {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      padding: calc(var(--safe-top) + 12px) 20px 12px;
      color: white;
      text-align: center;
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }
    .top-bar::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to bottom, rgba(255,107,157,0.15), transparent);
    }
    .top-bar h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .top-bar .day-info {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .top-bar .day-info .progress-mini {
      background: rgba(255,255,255,0.25);
      border-radius: 6px;
      height: 6px;
      width: 80px;
      overflow: hidden;
    }
    .top-bar .day-info .progress-mini-inner {
      height: 100%;
      background: white;
      border-radius: 6px;
      transition: width 0.5s ease;
    }

    /* ========== 主内容区 ========== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 16px 16px calc(var(--nav-height) + var(--safe-bottom) + 16px) 16px;
    }
    .main-content::-webkit-scrollbar { display: none; }

    /* ========== 天数选择器 ========== */
    .day-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding: 6px 0;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn {
      min-width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid #E5E7EB;
      background: white;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      scroll-snap-align: start;
      touch-action: manipulation;
    }
    .day-btn:active { transform: scale(0.92); }
    .day-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      border-color: transparent;
      color: white;
      box-shadow: 0 2px 8px rgba(255,107,157,0.25);
    }
    .day-btn.completed {
      background: var(--green);
      border-color: transparent;
      color: white;
      font-size: 12px;
    }
    .day-btn.completed.active {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      border-color: transparent;
    }

    /* ========== 提示框 ========== */
    .hint-box {
      background: linear-gradient(135deg, rgba(255,107,157,0.06), rgba(78,205,196,0.06));
      border: 1.5px dashed var(--pink);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      text-align: center;
    }
    .hint-box p {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .hint-box .hint-icon { font-size: 20px; margin-bottom: 2px; }
    .hint-box strong { color: var(--pink); }

    /* ========== 单词学习卡片 ========== */
    .words-panel, .story-panel, .vocab-panel, .chat-panel { display: none; }
    .words-panel.active, .story-panel.active, .vocab-panel.active, .chat-panel.active { display: block; }
    
    .word-card {
      background: white;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      min-height: 64px;
    }
    .word-card:active { transform: scale(0.98); }
    .word-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
    }
    .word-card:nth-child(1)::before { background: var(--pink); }
    .word-card:nth-child(2)::before { background: var(--blue); }
    .word-card:nth-child(3)::before { background: var(--yellow); }
    .word-card:nth-child(4)::before { background: var(--purple); }
    .word-card:nth-child(5)::before { background: var(--green); }
    .word-card:nth-child(6)::before { background: var(--orange); }
    
    .word-emoji { font-size: 30px; flex-shrink: 0; }
    .word-info { flex: 1; min-width: 0; }
    .word-en {
      font-size: 19px;
      font-weight: 700;
      color: #333;
      letter-spacing: 0.5px;
    }
    .word-ph {
      font-size: 13px;
      color: #9CA3AF;
      font-family: 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif;
      margin-top: 1px;
      letter-spacing: 0.5px;
    }
    .word-cn {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
      transition: all 0.25s ease;
    }
    .word-cn.hidden-cn {
      color: var(--pink);
      font-weight: 600;
      font-size: 13px;
    }
    .word-card .speak-btn {
      background: none;
      border: 1.5px solid var(--blue);
      color: var(--blue);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      line-height: 1;
      touch-action: manipulation;
      min-width: 38px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .word-card .speak-btn:active {
      background: var(--blue);
      color: white;
      transform: scale(0.9);
    }
    .word-card .reveal-btn {
      background: none;
      border: 1.5px solid var(--pink);
      color: var(--pink);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      touch-action: manipulation;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .word-card .reveal-btn:active {
      background: var(--pink);
      color: white;
      transform: scale(0.95);
    }
    .word-card .learned-badge {
      background: var(--green);
      color: white;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* ========== 绘本阅读 ========== */
    .story-title-card {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: white;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(78,205,196,0.25);
    }
    .story-title-card .day-badge {
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .story-title-card h2 { font-size: 22px; font-weight: 700; }
    .story-title-card .title-en { font-size: 15px; opacity: 0.85; margin-top: 3px; }

    .story-page {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--card-shadow);
      position: relative;
    }
    .story-page .page-num {
      position: absolute;
      top: 10px; right: 14px;
      background: var(--yellow);
      color: #333;
      width: 26px; height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .story-page .illustration {
      background: #F9FAFB;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .story-page .story-text {
      font-size: 17px;
      line-height: 2;
      color: #333;
    }
    .story-text .word-highlight {
      color: var(--pink);
      font-weight: 700;
      font-size: 19px;
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 2px dotted var(--pink);
      touch-action: manipulation;
      padding: 2px 0;
    }
    .story-text .word-highlight:active { transform: scale(1.05); }
    .story-text .word-highlight.no-cn::after {
      content: '🤔';
      font-size: 14px;
      position: relative;
      top: -2px;
      margin-left: 1px;
    }
    .story-text .word-highlight.has-cn::after {
      content: attr(data-cn);
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
      margin-left: 3px;
      position: relative;
      top: -2px;
    }
    /* 绘本中未打卡单词提示 */
    .story-text .word-highlight.no-cn {
      cursor: pointer;
    }

    /* ========== 画画区域 ========== */
    .draw-area {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: var(--card-shadow);
    }
    .draw-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .draw-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }
    .draw-title-text span { color: var(--pink); }
    .draw-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .draw-color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #E5E7EB;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .draw-color-btn.active {
      border-color: #333;
      transform: scale(1.15);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .draw-tool-btn {
      background: #F3F4F6;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .draw-tool-btn:active { transform: scale(0.92); background: #E5E7EB; }
    .draw-tool-btn.active { background: var(--pink); color: white; }
    .draw-separator {
      width: 1px;
      height: 20px;
      background: #E5E7EB;
      flex-shrink: 0;
    }
    .draw-canvas-wrap {
      border: 2px dashed #E5E7EB;
      border-radius: 12px;
      overflow: hidden;
      background: #FEFEFE;
      position: relative;
    }
    .draw-canvas {
      display: block;
      width: 100%;
      height: 180px;
      touch-action: none;
      cursor: crosshair;
      -webkit-touch-callout: none;
    }
    .draw-canvas.eraser-mode { cursor: cell; }

    /* ========== 完成按钮 ========== */
    .complete-section {
      text-align: center;
      margin-top: 20px;
      padding-bottom: 20px;
    }
    .complete-btn {
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 12px rgba(52,211,153,0.25);
      touch-action: manipulation;
      min-height: 48px;
    }
    .complete-btn:active { transform: scale(0.95); }
    .complete-btn.done {
      background: #E5E7EB;
      color: #888;
      box-shadow: none;
    }

    /* ========== 词汇总览 ========== */
    .vocab-day-group { margin-bottom: 10px; }
    .vocab-day-header {
      background: linear-gradient(135deg, rgba(255,107,157,0.08), rgba(78,205,196,0.08));
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 48px;
    }
    .vocab-day-header:active { transform: scale(0.98); }
    .vocab-day-header .day-tag {
      background: var(--pink);
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .vocab-day-header .expand-icon {
      font-size: 16px;
      color: #888;
      transition: transform 0.25s;
    }
    .vocab-day-header.expanded .expand-icon { transform: rotate(90deg); }
    .vocab-words { display: none; padding: 6px 0; }
    .vocab-words.expanded {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .vocab-word-tag {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .vocab-word-tag .tag-emoji { font-size: 14px; }
    .vocab-word-tag .tag-en { font-weight: 600; color: #333; }
    .vocab-word-tag .tag-cn { color: #888; font-size: 11px; }
    .vocab-word-tag.today-word {
      border-color: var(--pink);
      background: rgba(255,107,157,0.04);
    }
    .vocab-word-tag.learned-word {
      border-color: var(--green);
      background: rgba(52,211,153,0.04);
    }

    /* ========== 问姑姑聊天界面 ========== */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-messages::-webkit-scrollbar { display: none; }
    .chat-message {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .chat-message.user .chat-avatar {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      order: 2;
    }
    .chat-message.assistant .chat-avatar {
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }
    .chat-bubble {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .chat-message.user .chat-bubble {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: white;
      border-bottom-right-radius: 4px;
      margin-left: auto;
      order: 1;
    }
    .chat-message.assistant .chat-bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: var(--card-shadow);
    }
    .chat-input-area {
      border-top: 1px solid #E5E7EB;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      border: 1.5px solid #E5E7EB;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      font-family: var(--font);
      transition: border-color 0.2s;
    }
    .chat-input:focus {
      border-color: var(--pink);
    }
    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-send-btn:active {
      transform: scale(0.9);
    }
    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .chat-typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .chat-typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      animation: typing 1.4s infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
      30% { transform: translateY(-10px); opacity: 1; }
    }
    .chat-welcome {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    .chat-welcome-icon {
      font-size: 60px;
      margin-bottom: 16px;
    }
    .chat-welcome h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 8px;
    }
    .chat-welcome p {
      font-size: 14px;
      line-height: 1.6;
    }
    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }
    .chat-suggestion-btn {
      background: white;
      border: 1.5px solid #E5E7EB;
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chat-suggestion-btn:active {
      transform: scale(0.95);
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }
    .chat-api-setup {
      margin-top: 16px;
      padding: 16px;
      background: #F0F4FF;
      border-radius: 12px;
    }
    .api-hint {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .api-input {
      width: 100%;
      border: 1.5px solid #D1D5DB;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 8px;
      background: white;
    }
    .api-save-btn {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }
    .api-save-btn:active { transform: scale(0.97); }
    .api-help {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    .api-help a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }
    .chat-api-active {
      margin-top: 12px;
      padding: 12px;
      background: #ECFDF5;
      border-radius: 10px;
    }
    .api-status {
      font-size: 14px;
      color: #059669;
      font-weight: 600;
    }
    .api-clear-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ========== 底部导航 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: white;
      display: flex;
      z-index: 100;
      box-shadow: 0 -1px 8px rgba(0,0,0,0.06);
      border-top: 1px solid rgba(0,0,0,0.04);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
      padding: 8px 0;
      position: relative;
    }
    .nav-btn .nav-icon {
      font-size: 24px;
      line-height: 1;
      transition: transform 0.2s;
    }
    .nav-btn:active .nav-icon { transform: scale(0.85); }
    .nav-btn.active {
      color: var(--pink);
    }
    .nav-btn.active .nav-icon {
      transform: scale(1.05);
    }
    .nav-btn.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 25%;
      right: 25%;
      height: 2px;
      background: var(--pink);
      border-radius: 2px;
    }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 3px 12px rgba(52,211,153,0.35);
      pointer-events: none;
      max-width: 85vw;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========== 庆祝 ========== */
    .celebration {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .celebration.show { opacity: 1; pointer-events: auto; }
    .celebration-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      animation: popIn 0.4s ease;
      margin: 0 24px;
      max-width: 320px;
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .celebration-card .cele-emoji { font-size: 50px; margin-bottom: 10px; }
    .celebration-card h3 { font-size: 22px; color: #333; margin-bottom: 6px; }
    .celebration-card p { font-size: 14px; color: #888; line-height: 1.5; }
    .celebration-card .cele-btn {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      touch-action: manipulation;
    }

    /* ========== 单词弹窗 ========== */
    .word-popup {
      position: fixed;
      background: white;
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 150;
      animation: popIn 0.25s ease;
      text-align: center;
      max-width: 180px;
    }
    .word-popup .popup-word { font-size: 18px; font-weight: 700; color: var(--pink); }
    .word-popup .popup-cn { font-size: 13px; color: var(--blue); margin-top: 3px; }
    .word-popup .popup-emoji { font-size: 22px; margin-top: 3px; }

    /* ========== 滑动切换面板 ========== */
    .panel-wrapper {
      position: relative;
      overflow: hidden;
    }
    
    /* ========== 页面切换动画 ========== */
    @keyframes slideInRight {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .slide-in-right { animation: slideInRight 0.3s ease; }
    .slide-in-left { animation: slideInLeft 0.3s ease; }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <h1>🌈 英语乐园</h1>
      <div class="day-info">
        <span id="topDayLabel">第1天</span>
        <span id="topWordCount">0/270词</span>
        <div class="progress-mini">
          <div class="progress-mini-inner" id="topProgressBar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content" id="mainContent">
      
      <!-- 天数选择器 -->
      <div class="day-selector" id="daySelector"></div>

      <!-- 学单词 -->
      <div class="words-panel active" id="wordsPanel">
        <div id="wordsCards"></div>
        <div class="complete-section" id="completeSection">
          <button class="complete-btn" id="completeBtn" onclick="markDayComplete()">
            ✅ 完成今天的学习！
          </button>
        </div>
      </div>

      <!-- 读绘本 -->
      <div class="story-panel" id="storyPanel">
        <div class="hint-box">
          <div class="hint-icon">📖</div>
          <p><strong>粉色</strong>单词 = 今天学的，自己想中文！<br>蓝色小字 = 以前打卡过的，有中文提示</p>
        </div>
        <div id="storyContent"></div>
      </div>

      <!-- 词汇表 -->
      <div class="vocab-panel" id="vocabPanel">
        <div id="vocabContent"></div>
      </div>

      <!-- 问姑姑 -->
      <div class="chat-panel" id="chatPanel">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-welcome">
            <div class="chat-welcome-icon">👩‍🏫</div>
            <h3>我是英语姑姑</h3>
            <p>有什么英语问题都可以问我哦！<br>接入AI后回答更聪明～</p>
            <div class="chat-api-setup" id="chatApiSetup">
              <p class="api-hint">🔑 输入Gemini API Key开启AI对话（免费）</p>
              <input type="text" class="api-input" id="apiKeyInput" placeholder="输入你的Gemini API Key..." />
              <button class="api-save-btn" onclick="saveApiKey()">保存并启用 ✨</button>
              <p class="api-help"><a href="https://aistudio.google.com/apikey" target="_blank">免费获取API Key →</a></p>
            </div>
            <div class="chat-api-active" id="chatApiActive" style="display:none">
              <p class="api-status">✅ AI已启用 · <button onclick="clearApiKey()" class="api-clear-btn">切换回离线模式</button></p>
            </div>
            <div class="chat-suggestions">
              <button class="chat-suggestion-btn" onclick="sendQuickQuestion('mom怎么读？')">mom怎么读？</button>
              <button class="chat-suggestion-btn" onclick="sendQuickQuestion('苹果用英语怎么说？')">苹果用英语怎么说？</button>
              <button class="chat-suggestion-btn" onclick="sendQuickQuestion('good和well有什么区别？')">good和well的区别？</button>
            </div>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chatInput" placeholder="问我任何英语问题..." />
          <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">📤</button>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <button class="nav-btn active" id="navWords" onclick="switchTab('words')">
        <span class="nav-icon">📚</span>
        <span>学单词</span>
      </button>
      <button class="nav-btn" id="navStory" onclick="switchTab('story')">
        <span class="nav-icon">📖</span>
        <span>读绘本</span>
      </button>
      <button class="nav-btn" id="navVocab" onclick="switchTab('vocab')">
        <span class="nav-icon">🗂️</span>
        <span>词汇表</span>
      </button>
      <button class="nav-btn" id="navChat" onclick="switchTab('chat')">
        <span class="nav-icon">💬</span>
        <span>问姑姑</span>
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 庆祝动画 -->
  <div class="celebration" id="celebration">
    <div class="celebration-card">
      <div class="cele-emoji">🎉</div>
      <h3>太棒了！</h3>
      <p id="cele-text">今天的单词全部学会了！</p>
      <button class="cele-btn" onclick="closeCelebration()">继续学习</button>
    </div>
  </div>

  <script>
    // ========== 状态管理 ==========
    let currentDay = 1;
    let currentTab = 'words';
    let completedDays = {};
    let revealedWords = {};

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem('eng_learn_progress') || '{}');
        completedDays = saved.completedDays || {};
        revealedWords = saved.revealedWords || {};
        currentDay = saved.currentDay || 1;
        const todayDate = new Date().toDateString();
        const lastDate = saved.lastDate || '';
        if (todayDate !== lastDate) {
          for (let d = 1; d <= 45; d++) {
            if (!completedDays[d]) { currentDay = d; break; }
          }
        }
      } catch(e) { currentDay = 1; }
    }

    function saveProgress() {
      localStorage.setItem('eng_learn_progress', JSON.stringify({
        completedDays, revealedWords, currentDay,
        lastDate: new Date().toDateString()
      }));
    }

    // ========== 已学单词列表 ==========
    function getPreviouslyLearnedWords(beforeDay) {
      const learned = [];
      for (let d = 1; d < beforeDay; d++) {
        if (completedDays[d]) {
          const dayData = WORDS_DATA.find(w => w.day === d);
          if (dayData) dayData.words.forEach(w => learned.push(w.en.toLowerCase()));
        }
      }
      return learned;
    }

    // ========== 朗读功能 ==========
    let audioReady = false;
    let cachedVoices = [];
    
    // 初始化语音（需要在页面加载后调用）
    function initAudio() {
      if ('speechSynthesis' in window) {
        // iOS Safari 需要先获取 voices
        const loadVoices = () => {
          cachedVoices = window.speechSynthesis.getVoices();
        };
        loadVoices();
        // 有些浏览器需要延迟加载
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        audioReady = true;
      }
    }
    
    // 页面加载后初始化音频
    document.addEventListener('DOMContentLoaded', initAudio);
    
    function speakWord(word, btnElement) {
      if (!('speechSynthesis' in window)) {
        showToast('您的浏览器不支持语音播放');
        return;
      }
      
      // 按钮动画反馈
      if (btnElement) {
        btnElement.style.transform = 'scale(1.15)';
        btnElement.style.background = 'var(--blue)';
        btnElement.style.color = 'white';
        setTimeout(() => {
          btnElement.style.transform = '';
          btnElement.style.background = '';
          btnElement.style.color = '';
        }, 1000);
      }
      
      window.speechSynthesis.cancel();
      
      // 查找最佳英语语音 - 优先选清晰慢速的
      let enVoice = cachedVoices.find(v => v.lang.includes('en-US') && v.name.includes('Samantha'))
                   || cachedVoices.find(v => v.lang.includes('en-US'))
                   || cachedVoices.find(v => v.lang.startsWith('en') && !v.lang.includes('GB'))
                   || cachedVoices.find(v => v.lang.startsWith('en'));
      
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.5; // 慢速，避免吞音
      u.pitch = 1.0;
      u.volume = 1;
      
      if (enVoice) {
        u.voice = enVoice;
      }
      
      window.speechSynthesis.speak(u);
    }

    // ========== 画画功能 ==========
    let drawColor = '#333';
    let drawSize = 6;
    let drawEraser = false;
    let drawHistory = [];
    let drawCanvas, drawCtx;
    let isDrawing = false;
    let lastX, lastY;

    function initDrawCanvas() {
      drawCanvas = document.getElementById('drawCanvas');
      if (!drawCanvas) return;
      drawCtx = drawCanvas.getContext('2d');
      
      // 等DOM渲染完再测量，确保位置准确
      requestAnimationFrame(() => {
        const dpr = window.devicePixelRatio || 1;
        const rect = drawCanvas.getBoundingClientRect();
        const w = Math.round(rect.width);
        const h = Math.round(rect.height);
        
        drawCanvas.width = w * dpr;
        drawCanvas.height = h * dpr;
        drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // 白色背景
        drawCtx.fillStyle = '#FEFEFE';
        drawCtx.fillRect(0, 0, w, h);
        
        loadDrawData(w, h);
        drawHistory = [];
        saveDrawState();
      });
      
      // 触摸事件
      drawCanvas.addEventListener('touchstart', onDrawStart, false);
      drawCanvas.addEventListener('touchmove', onDrawMove, false);
      drawCanvas.addEventListener('touchend', onDrawEnd, false);
      drawCanvas.addEventListener('touchcancel', onDrawEnd, false);
      // 鼠标事件
      drawCanvas.addEventListener('mousedown', onDrawStartMouse, false);
      drawCanvas.addEventListener('mousemove', onDrawMoveMouse, false);
      drawCanvas.addEventListener('mouseup', onDrawEnd, false);
      drawCanvas.addEventListener('mouseleave', onDrawEnd, false);
    }

    function getDrawPos(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function drawDot(x, y) {
      drawCtx.beginPath();
      drawCtx.arc(x, y, drawEraser ? drawSize * 1.5 : drawSize / 2, 0, Math.PI * 2);
      drawCtx.fillStyle = drawEraser ? '#FEFEFE' : drawColor;
      drawCtx.fill();
    }

    function drawLine(x1, y1, x2, y2) {
      drawCtx.beginPath();
      drawCtx.moveTo(x1, y1);
      drawCtx.lineTo(x2, y2);
      drawCtx.strokeStyle = drawEraser ? '#FEFEFE' : drawColor;
      drawCtx.lineWidth = drawEraser ? drawSize * 3 : drawSize;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
    }

    function onDrawStart(e) {
      e.preventDefault();
      e.stopPropagation();
      isDrawing = true;
      const t = e.touches[0];
      const pos = getDrawPos(t.clientX, t.clientY);
      lastX = pos.x;
      lastY = pos.y;
      drawDot(pos.x, pos.y);
    }

    function onDrawMove(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!isDrawing) return;
      const t = e.touches[0];
      const pos = getDrawPos(t.clientX, t.clientY);
      drawLine(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    }

    function onDrawStartMouse(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getDrawPos(e.clientX, e.clientY);
      lastX = pos.x;
      lastY = pos.y;
      drawDot(pos.x, pos.y);
    }

    function onDrawMoveMouse(e) {
      if (!isDrawing) return;
      const pos = getDrawPos(e.clientX, e.clientY);
      drawLine(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    }

    function onDrawEnd() {
      if (isDrawing) {
        isDrawing = false;
        saveDrawState();
      }
    }

    function saveDrawState() {
      if (!drawCanvas) return;
      try {
        const data = drawCanvas.toDataURL();
        drawHistory.push(data);
        if (drawHistory.length > 30) drawHistory.shift();
        localStorage.setItem(`draw_day_${currentDay}`, data);
      } catch(e) {}
    }

    function loadDrawData(w, h) {
      try {
        const saved = localStorage.getItem(`draw_day_${currentDay}`);
        if (saved) {
          const img = new Image();
          img.onload = () => {
            drawCtx.clearRect(0, 0, w, h);
            drawCtx.drawImage(img, 0, 0, w, h);
          };
          img.src = saved;
        }
      } catch(e) {}
    }

    function setDrawColor(color, idx) {
      drawColor = color;
      drawEraser = false;
      document.getElementById('eraserBtn')?.classList.remove('active');
      drawCanvas?.classList.remove('eraser-mode');
      document.querySelectorAll('.draw-color-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
    }

    function setBrushSize(size) {
      drawSize = size;
      document.getElementById('brushThin')?.classList.toggle('active', size === 3);
      document.getElementById('brushMid')?.classList.toggle('active', size === 6);
      document.getElementById('brushBold')?.classList.toggle('active', size === 12);
    }

    function toggleEraser() {
      drawEraser = !drawEraser;
      const btn = document.getElementById('eraserBtn');
      btn?.classList.toggle('active', drawEraser);
      drawCanvas?.classList.toggle('eraser-mode', drawEraser);
    }

    function undoDraw() {
      if (drawHistory.length <= 1) return;
      drawHistory.pop();
      const prev = drawHistory[drawHistory.length - 1];
      const img = new Image();
      img.onload = () => {
        const rect = drawCanvas.getBoundingClientRect();
        drawCtx.clearRect(0, 0, rect.width, rect.height);
        drawCtx.drawImage(img, 0, 0, rect.width, rect.height);
        try { localStorage.setItem(`draw_day_${currentDay}`, prev); } catch(e) {}
      };
      img.src = prev;
    }

    function clearDraw() {
      if (!drawCanvas || !drawCtx) return;
      const rect = drawCanvas.getBoundingClientRect();
      drawCtx.fillStyle = '#FEFEFE';
      drawCtx.fillRect(0, 0, rect.width, rect.height);
      saveDrawState();
    }

    // ========== 绘本中点击单词 ==========
    function onStoryWordClick(event, wordEn) {
      speakWord(wordEn);
      const dayData = WORDS_DATA.find(d => d.day === currentDay);
      const todayWords = dayData ? dayData.words : [];
      const isToday = todayWords.find(w => w.en.toLowerCase() === wordEn.toLowerCase());
      
      const oldPopup = document.querySelector('.word-popup');
      if (oldPopup) oldPopup.remove();
      
      if (isToday && !completedDays[currentDay]) {
        const popup = document.createElement('div');
        popup.className = 'word-popup';
        popup.innerHTML = `
          <div class="popup-word">${isToday.en}</div>
          <div class="popup-emoji">${isToday.emoji}</div>
          <div class="popup-cn" style="color:var(--pink)">🤔 你能想到中文意思吗？</div>
        `;
        document.body.appendChild(popup);
        const rect = event.target.getBoundingClientRect();
        popup.style.top = `${rect.bottom + 6}px`;
        popup.style.left = `${Math.max(8, Math.min(rect.left + rect.width/2 - popup.offsetWidth/2, window.innerWidth - popup.offsetWidth - 8))}px`;
        setTimeout(() => { if (popup.parentNode) popup.remove(); }, 2500);
      } else if (!isToday || completedDays[currentDay]) {
        const allWords = WORDS_DATA.flatMap(d => d.words);
        const wordObj = allWords.find(w => w.en.toLowerCase() === wordEn.toLowerCase());
        if (wordObj) {
          const popup = document.createElement('div');
          popup.className = 'word-popup';
          popup.innerHTML = `
            <div class="popup-word">${wordObj.en}</div>
            <div class="popup-emoji">${wordObj.emoji}</div>
            <div class="popup-cn">${wordObj.cn}</div>
          `;
          document.body.appendChild(popup);
          const rect = event.target.getBoundingClientRect();
          popup.style.top = `${rect.bottom + 6}px`;
          popup.style.left = `${Math.max(8, Math.min(rect.left + rect.width/2 - popup.offsetWidth/2, window.innerWidth - popup.offsetWidth - 8))}px`;
          setTimeout(() => { if (popup.parentNode) popup.remove(); }, 2500);
        }
      }
    }

    // ========== 渲染天数选择器 ==========
    function renderDaySelector() {
      const selector = document.getElementById('daySelector');
      selector.innerHTML = '';
      for (let d = 1; d <= 45; d++) {
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        if (d === currentDay) btn.classList.add('active');
        if (completedDays[d]) btn.classList.add('completed');
        btn.textContent = completedDays[d] ? '✓' : d;
        btn.onclick = () => selectDay(d);
        selector.appendChild(btn);
      }
      setTimeout(() => {
        const activeBtn = selector.querySelector('.day-btn.active');
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }, 50);
    }

    // ========== 选择某天 ==========
    function selectDay(day) {
      currentDay = day;
      saveProgress();
      renderDaySelector();
      renderCurrentView();
      // 滚动到顶部
      document.getElementById('mainContent').scrollTop = 0;
    }

    // ========== 渲染当前视图 ==========
    function renderCurrentView() {
      const completedCount = Object.keys(completedDays).length;
      const totalLearnedWords = completedCount * 5;
      
      // 顶部栏信息
      document.getElementById('topDayLabel').textContent = `第${currentDay}天`;
      document.getElementById('topWordCount').textContent = `${totalLearnedWords}/270词`;
      document.getElementById('topProgressBar').style.width = `${(totalLearnedWords/270)*100}%`;

      // 完成按钮
      const completeBtn = document.getElementById('completeBtn');
      if (completedDays[currentDay]) {
        completeBtn.className = 'complete-btn done';
        completeBtn.textContent = '✅ 今天已完成！';
      } else {
        completeBtn.className = 'complete-btn';
        completeBtn.textContent = '✅ 完成今天的学习！';
      }

      renderWordsCards();
      renderStory();
      renderVocab();
    }

    // ========== 渲染单词卡片 ==========
    function renderWordsCards() {
      const container = document.getElementById('wordsCards');
      const dayData = WORDS_DATA.find(d => d.day === currentDay);
      if (!dayData) { container.innerHTML = '<p>暂无数据</p>'; return; }

      container.innerHTML = '';
      dayData.words.forEach((word, idx) => {
        const card = document.createElement('div');
        card.className = 'word-card';
        const isRevealed = revealedWords[currentDay] && revealedWords[currentDay].includes(idx);
        
        let cnDisplay;
        if (completedDays[currentDay] || isRevealed) {
          cnDisplay = `<div class="word-cn">${word.cn}</div>`;
        } else {
          cnDisplay = `<div class="word-cn hidden-cn">🤔 点击「完成打卡」</div>`;
        }
        
        let actionBtns;
        if (completedDays[currentDay]) {

    // ========== 处理绘本文字 ==========
    function processStoryText(text, dayNum) {
      const dayData = WORDS_DATA.find(d => d.day === dayNum);
      const todayWords = dayData ? dayData.words : [];
      const allWords = WORDS_DATA.flatMap(d => d.words);
      const previouslyLearned = getPreviouslyLearnedWords(dayNum);
      
      // 先处理多词词汇（如"ice cream"）
      const multiWordPatterns = allWords
        .filter(w => w.en.includes(' '))
        .map(w => ({ en: w.en, regex: new RegExp(`\\b${w.en.replace(/ /g, '\\s+')}\\b`, 'gi'), wordObj: w }));
      
      const singleWordPattern = /\b([a-zA-Z]+(?:'[a-zA-Z]+)?)\b/g;
      
      let result = text;
      for (const mwp of multiWordPatterns) {
        result = result.replace(mwp.regex, (match) => {
          if (todayWords.find(w => w.en.toLowerCase() === mwp.en.toLowerCase())) {
            return `<span class="word-highlight no-cn" onclick="onStoryWordClick(event,'${mwp.en}')">${mwp.en}</span>`;
          }
          return `<span class="word-highlight has-cn" onclick="onStoryWordClick(event,'${mwp.en}')\" data-cn="${mwp.wordObj.cn}">${mwp.en}</span>`;
        });
      }
      
      result = result.replace(singleWordPattern, (match) => {
        const cleaned = match.toLowerCase();
        if (!cleaned) return match;
        const todayMatch = todayWords.find(w => w.en.toLowerCase() === cleaned);
        if (todayMatch) {
          return `<span class="word-highlight no-cn" onclick="onStoryWordClick(event,'${todayMatch.en}')">${todayMatch.en}</span>`;
        }
        if (previouslyLearned.includes(cleaned)) {
          const wordObj = allWords.find(w => w.en.toLowerCase() === cleaned);
          if (wordObj) {
            return `<span class="word-highlight has-cn" onclick="onStoryWordClick(event,'${wordObj.en}')\" data-cn="${wordObj.cn}">${wordObj.en}</span>`;
          }
        }
        return match;
      });
      
      return result;
    }

    // Gemini AI API调用
    async function callGeminiAI(question, typingId) {
      try {
        // 构造学习上下文
        const dayData = WORDS_DATA.find(d => d.day === currentDay);
        const todayWords = dayData ? dayData.words.map(w => `${w.en}(${w.cn})`).join(', ') : '';
        
        const systemPrompt = `你是一个温柔的英语老师，叫"英语姑姑"，专门教小朋友学英语。
当前是第${currentDay}天，今天学的单词是：${todayWords}。
回答要求：
1. 用温柔鼓励的语气，像跟小朋友说话
2. 适当用emoji让回答更活泼
3. 如果涉及单词，给出音标和中文意思
4. 用简单易懂的语言解释
5. 可以给小例句帮助理解
6. 回答尽量简洁（3-5句话）`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiApiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [
                { role: 'user', parts: [{ text: systemPrompt }] },
                { role: 'model', parts: [{ text: '好的，我会用温柔的方式教小朋友英语！' }] },
                { role: 'user', parts: [{ text: question }] }
              ],
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 300
              }
            })
          }
        );
        
        const data = await response.json();
        removeTypingIndicator(typingId);
        
        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
          let answer = data.candidates[0].content.parts[0].text;
          // 清理Markdown格式
          answer = answer.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          answer = answer.replace(/\*(.*?)\*/g, '$1');
          answer = answer.replace(/^#+ .*/gm, '');
          addChatMessage('assistant', answer);
        } else {
          addChatMessage('assistant', '抱歉，我暂时无法回答 😅\n请检查API Key是否正确，或稍后再试～');
        }
      } catch (e) {
        removeTypingIndicator(typingId);
        if (e.message.includes('401') || e.message.includes('403')) {
          addChatMessage('assistant', 'API Key好像不对哦 🔑\n请检查Key是否正确，或者<a href="https://aistudio.google.com/apikey" target="_blank">重新获取</a>');
        } else {
          addChatMessage('assistant', '网络出了点问题 😅\n试试以下方式：\n📌 切换回离线模式继续使用\n📌 检查网络连接');
        }
      }
    }

    // 离线模式：规则匹配回答
    const CN_EN_DICT = {
      '你好': 'Hello / Hi', '谢谢': 'Thank you', '对不起': 'Sorry',
      '再见': 'Goodbye', '请': 'Please', '是': 'Yes', '不': 'No',
      '我爱你': 'I love you', '早上好': 'Good morning', '晚安': 'Good night',
      '吃': 'eat', '喝': 'drink', '玩': 'play', '看': 'look',
      '跑': 'run', '走': 'walk', '坐': 'sit', '站': 'stand',
      '大': 'big', '小': 'small', '多': 'many', '少': 'few',
      '好': 'good', '坏': 'bad', '快': 'fast', '慢': 'slow',
      '冷': 'cold', '热': 'hot', '新': 'new', '旧': 'old',
      '长': 'long', '短': 'short', '高': 'tall', '低': 'low',
      '开心': 'happy', '伤心': 'sad', '害怕': 'scared', '生气': 'angry',
      '漂亮': 'beautiful', '聪明': 'smart', '猫': 'cat', '狗': 'dog',
      '妈妈': 'mom', '爸爸': 'dad', '兄弟': 'brother', '姐妹': 'sister',
      '家庭': 'family', '朋友': 'friend', '老师': 'teacher', '宝宝': 'baby',
      '苹果': 'apple', '香蕉': 'banana', '牛奶': 'milk', '蛋糕': 'cake',
      '鸡蛋': 'egg', '面包': 'bread', '米饭': 'rice', '水': 'water',
      '红色': 'red', '蓝色': 'blue', '绿色': 'green', '黄色': 'yellow',
    };

    function getAIAnswer(question) {
      const q = question.toLowerCase().trim();
      
      // 1. 直接输入英文单词
      const enWords = q.match(/\b[a-zA-Z]+(?:\s[a-zA-Z]+)?\b/g);
      if (enWords && enWords.length === 1 && q.length <= 30) {
        const wordData = findWordInData(enWords[0]);
        if (wordData) {
          const dayInfo = findDayForWord(wordData.en);
          return `${wordData.emoji} <strong>${wordData.en}</strong>\n音标：${wordData.ph}\n中文：${wordData.cn}\n第${dayInfo}天学习内容\n点击🔊可以听发音！`;
        }
        return `我还没学到 "${enWords[0]}" 这个词呢！\n输入Gemini API Key后，我可以回答任何问题哦～`;
      }
      
      // 2. 直接输入中文 → 翻译
      const cnKey = question.replace(/[？?！!。.，,吗呢吧啊呀]/g, '').trim();
      if (CN_EN_DICT[cnKey]) {
        const en = CN_EN_DICT[cnKey];
        const wordData = findWordInData(cnKey);
        if (wordData) {
          return `${wordData.emoji} "${cnKey}" 用英语说是 <strong>${wordData.en}</strong>\n音标：${wordData.ph}\n记得多听多读哦！`;
        }
        return `"${cnKey}" 用英语说是 <strong>${en}</strong>\n多多练习，慢慢就会记住啦！`;
      }
      
      // 3-7. 各种问题类型（简化）
      if (q.includes('怎么读') || q.includes('发音') || q.includes('读音')) {
        const word = extractWord(question);
        if (word) { const wd = findWordInData(word); if (wd) return `${wd.emoji} <strong>${wd.en}</strong> ${wd.ph}\n意思是"${wd.cn}"，点击🔊听发音！`; }
        return '告诉我你想知道哪个单词的发音？\n💡 输入API Key后可以问任何问题！';
      }
      if (q.includes('什么意思') || q.includes('啥意思')) {
        const word = extractWord(question);
        if (word) { const wd = findWordInData(word); if (wd) return `${wd.emoji} <strong>${wd.en}</strong> = "${wd.cn}"\n音标：${wd.ph}`; }
        return '告诉我你想知道哪个单词的意思？\n💡 输入API Key后可以问任何问题！';
      }
      if (q.includes('怎么说') || q.includes('英语怎么') || q.includes('用英语')) {
        for (const [cn, en] of Object.entries(CN_EN_DICT)) {
          if (question.includes(cn)) {
            const wd = findWordInData(cn);
            if (wd) return `${wd.emoji} "${cn}" = <strong>${wd.en}</strong> ${wd.ph}`;
            return `"${cn}" = <strong>${en}</strong> 💪`;
          }
        }
        const allW = WORDS_DATA.flatMap(d => d.words);
        for (const w of allW) { if (question.includes(w.cn)) return `${w.emoji} "${w.cn}" = <strong>${w.en}</strong> ${w.ph}`; }
        return '告诉我你想翻译什么？\n💡 输入API Key后可以翻译任何内容！';
      }
      if (q.includes('你好') || q === 'hi' || q === 'hello') return '👋 你好！有什么英语问题问我？\n💡 输入API Key后可以像豆包一样对话！';
      if (q.includes('你是谁')) return '👩‍🏫 我是英语姑姑！教你学英语的～\n💡 输入API Key后我会变得更聪明！';
      
      // 包含中文词
      const allW = WORDS_DATA.flatMap(d => d.words);
      for (const w of allW) { if (question.includes(w.cn)) return `${w.emoji} "${w.cn}" = <strong>${w.en}</strong> ${w.ph}`; }
      for (const [cn, en] of Object.entries(CN_EN_DICT)) { if (question.includes(cn)) return `"${cn}" = <strong>${en}</strong>`; }
      
      return `我暂时不太理解 😅\n\n💡 <strong>输入Gemini API Key后</strong>，我可以像豆包一样回答任何问题！\n\n免费获取Key：点击上方链接 →\n\n现在我可以帮你：\n📌 输入单词查发音和意思\n📌 输入中文查英语翻译`;
    }
    
    function extractWord(text) {
      const enMatch = text.match(/\b([a-zA-Z]+(?:\s[a-zA-Z]+)?)\b/);
      if (enMatch) return enMatch[1].toLowerCase();
      const quoteMatch = text.match(/[\"\"'']([^\"\"'']+)[\"\"'']/);
      if (quoteMatch) return quoteMatch[1];
      const cnWords = WORDS_DATA.flatMap(d => d.words);
      for (const w of cnWords) { if (text.includes(w.cn)) return w.cn; }
      return null;
    }
    
    function findWordInData(word) {
      const allWords = WORDS_DATA.flatMap(d => d.words);
      return allWords.find(w => w.en.toLowerCase() === word.toLowerCase() || w.cn === word || w.cn.includes(word)) || null;
    }
    
    function findDayForWord(wordEn) {
      for (const dayData of WORDS_DATA) {
        if (dayData.words.find(w => w.en.toLowerCase() === wordEn.toLowerCase())) return dayData.day;
      }
      return '?';
    }
    
    // 回车发送
    document.addEventListener('DOMContentLoaded', () => {
      const chatInput = document.getElementById('chatInput');
      if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });

    // ========== Toast ==========
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ========== 初始化 ==========
    loadProgress();
    renderDaySelector();
    renderCurrentView();

    // 防止双击缩放
    document.addEventListener('dblclick', e => e.preventDefault());
    
    // 注册PWA service worker（简化版，仅缓存本页）
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'eng-learn-v1';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/index.html', '/data.js', '/manifest.json'])));
          self.skipWaiting();
        });
        self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
